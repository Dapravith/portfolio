name: Weekly health check

# Catches problems that appear without a code change: a project repository
# renamed or made private, a new advisory for a dependency.
on:
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC (09:17 in Phnom Penh)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: External links
        run: npm run links:external
      - name: Dependency audit
        if: always()
        run: npm audit --omit=dev --audit-level=moderate
